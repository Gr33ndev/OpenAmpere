name: Bug report / Fehler melden
description: Something does not work as expected. / Etwas funktioniert nicht wie erwartet.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your report! Please do **not** enter personal data: IP or MAC addresses, serial numbers, passwords,
        API keys, addresses or meter numbers. Give plant data only roughly (e.g. "about 10 kWp").
        Do not report security vulnerabilities here; follow SECURITY.md instead. Reports in German are welcome.

        Danke für deine Meldung! Bitte **keine persönlichen Daten** eintragen: keine IP- oder MAC-Adressen,
        Seriennummern, Passwörter, API-Schlüssel, Adressen oder Zählernummern. Anlagendaten nur ungefähr angeben
        (z. B. „etwa 10 kWp“).
        Sicherheitslücken bitte nicht hier, sondern wie in SECURITY.md beschrieben melden.
        **Du kannst dein Anliegen gern auf Deutsch schreiben.**
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: |
        Describe the bug. What did you see, and what did you expect?

        Beschreibe den Fehler. Was hast du gesehen, was hättest du erwartet?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can the bug be reproduced? / Wie lässt sich der Fehler nachstellen?
      placeholder: |
        1. Open Mehr → … (More → …) / Mehr → … öffnen
        2. Tap … / Auf … tippen
        3. Error message "…" appears / Fehlermeldung „…“ erscheint
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenAmpere version / OpenAmpere-Version
      description: |
        Shown under **Mehr → Über OpenAmpere** (More → About OpenAmpere).

        Steht unter **Mehr → Über OpenAmpere**.
      placeholder: e.g. 0.3.0 / z. B. 0.3.0
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device / Gerät
      options:
        - FoxESS H3 / H3 Smart / H3 Pro (also / auch „Ampere.StoragePro E3“)
        - SAJ H2 / HS2 (also older / auch ältere „Ampere.StoragePro“)
        - Simulator
        - Other, don't know / Anderes, weiß nicht
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker (Proxmox, NAS, Server)
        - Docker on Raspberry Pi / Docker auf Raspberry Pi
        - Without Docker (Python) / Ohne Docker (Python)
        - Other / Anderes
  - type: dropdown
    id: area
    attributes:
      label: Area / Bereich
      multiple: true
      options:
        - Setup, connection / Einrichtung, Verbindung
        - Overview, live values / Übersicht, Live-Werte
        - Devices (battery, wallbox, heating rod) / Geräte (Speicher, Wallbox, Heizstab)
        - Reports / Auswertung
        - Battery & control / Speicher & Steuerung
        - Feed-in limitation / Einspeisebegrenzung
        - Tariffs, advance payments, grid charging / Tarife, Abschläge, Laden aus dem Netz
        - Notifications / Benachrichtigungen
        - Diagnostics / Diagnose
        - Data, export, backup, cloud import / Daten, Export, Sicherung, Cloud-Import
        - Installation & updates / Installation & Updates
        - Login, access protection / Anmeldung, Zugriffsschutz
        - Appearance, iPhone app / Darstellung, iPhone-App
        - Other / Sonstiges
  - type: input
    id: browser
    attributes:
      label: Browser / phone / Browser / Handy
      placeholder: e.g. iPhone 15, Safari, as an app on the home screen / z. B. iPhone 15, Safari, als App auf dem Home-Bildschirm
  - type: textarea
    id: cause
    attributes:
      label: Suspected cause or fix idea (optional) / Vermutete Ursache oder Lösungsidee (optional)
      description: |
        If you have an idea what causes it, or have already looked at the code.

        Falls du eine Idee hast, woran es liegt, oder schon im Code nachgesehen hast.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: |
        Very helpful for display bugs. Black out personal data first.

        Bei Anzeigefehlern sehr hilfreich. Persönliche Daten vorher schwärzen.
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics report (recommended) / Diagnosebericht (empfohlen)
      description: |
        **Mehr → Diagnose** (More → Diagnostics): start the diagnostics, tap "Bericht kopieren" (copy report) and paste
        it here. It ends with the last lines of the server log; IP addresses, host names and the serial number are
        already replaced, and it also works while the inverter is not connected. For a hard-to-find bug, first set
        **Protokoll** (log) on the same page to "Ausführlich (für Fehlersuche)" (detailed), let the bug happen again
        and then create the report. Only if the app does not open at all: `docker compose logs --tail 100 openampere`,
        and remove personal data first.

        **Mehr → Diagnose**: Diagnose starten, auf „Bericht kopieren“ tippen und hier einfügen. Am Ende stehen die
        letzten Zeilen des Server-Protokolls; IP-Adressen, Gerätenamen und die Seriennummer sind darin schon ersetzt,
        und es geht auch, wenn der Wechselrichter gerade nicht verbunden ist. Bei schwer zu findenden Fehlern vorher auf
        derselben Seite unter **Protokoll** „Ausführlich (für Fehlersuche)“ wählen, den Fehler noch einmal auftreten
        lassen und dann den Bericht erstellen. Nur wenn sich die App gar nicht öffnen lässt:
        `docker compose logs --tail 100 openampere`, persönliche Daten vorher entfernen.
  - type: checkboxes
    id: checks
    attributes:
      label: Checked beforehand / Vorab geprüft
      options:
        - label: I have searched for similar issues. / Ich habe nach ähnlichen Issues gesucht.
          required: true
        - label: My report contains no personal data. / Meine Meldung enthält keine persönlichen Daten.
          required: true
