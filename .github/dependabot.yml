version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]  # only this one, not one label per ecosystem
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps-web)"
    labels: ["dependencies"]  # only this one, not one label per ecosystem
    groups:
      # vite and its plugins only work in matching major versions, so they are updated together
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]  # only this one, not one label per ecosystem
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(docker)"
    labels: ["dependencies"]  # only this one, not one label per ecosystem
