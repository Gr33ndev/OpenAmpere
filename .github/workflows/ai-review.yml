name: AI review

# Automatic review of pull requests with Claude (#423): checks the pull request against its issue, the documentation,
# the device knowledge in docs/devices/ and the rules in AGENTS.md. The instructions are in .github/claude-review.md.
# It only comments; a maintainer decides. Runs once a pull request is ready for review and again on the label
# "ai-review" (remove and add it to run once more).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  # one review per pull request; adding another label gets a group of its own, so it does not cancel a running review
  group: ai-review-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'ai-review' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    # Only pull requests from this repository: fork pull requests get no secrets, and pull_request_target would hand
    # them over. Dependabot gets no secrets either. Issue and pull request texts reach Claude as data, so it only gets
    # read tools and commenting.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch the linked issues
        # here, not by Claude: the comparison with the issue must not depend on the model fetching it
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .ai-review
          out=.ai-review/issues.md
          : > "$out"
          for n in $(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[].number'); do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq '"# Issue #\(.number): \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body // "")\n"' >> "$out"
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$n/comments" --jq '.[] | "## Comment by \(.user.login)\n\n\(.body)\n"' >> "$out"
          done
          wc -l "$out"
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the token of this workflow instead of the Claude GitHub App: no app with write access to the
          # repository, comments come from github-actions[bot] (no other workflow comments on pull requests,
          # which matters for "gh pr comment --edit-last" in .github/claude-review.md)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following .github/claude-review.md.
            The linked issues with all their comments are in .ai-review/issues.md (empty: no linked issue).
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
