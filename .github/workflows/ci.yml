name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # started by the licenses workflow after it committed updated license files

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Code style (ruff)
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Third-party licence list up to date
        run: |
          cd web && npm ci && cd ..
          python scripts/third_party_licenses.py --check

  homeassistant:
    # the Home Assistant integration (custom_components/openampere, #76): its own Python and pinned test tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: pip install --require-hashes -r tests_ha/requirements.lock
      - name: Tests
        run: pytest -q tests_ha

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hacs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Code style (Biome)
        run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Demo covers every API endpoint
        run: npm run check:demo
        working-directory: web
      - name: Translations match the texts in the code
        run: npm run check:i18n
        working-directory: web

  ui:
    runs-on: ubuntu-latest
    # usually about 2 minutes; a stuck step fails instead of running for hours (#157)
    timeout-minutes: 15
    # browsers and their system packages come with the image: no download from the package mirrors on every run (#157).
    # The version must be the one of @playwright/test in web/package.json, the first step after npm ci checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Container image has the browsers of @playwright/test
        run: |
          for dir in $(npx playwright install --dry-run chromium webkit | sed -n 's/^ *Install location: *//p'); do
            [ -d "$dir" ] && continue
            echo "::error::$dir is missing: set the image in .github/workflows/ci.yml to the version of @playwright/test ($(node -p "require('@playwright/test/package.json').version"))"
            exit 1
          done
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: UI tests (every page, desktop and iPhone)
        run: npm run test:ui
        working-directory: web
      - name: Report with traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: openampere:ci
      - name: Container becomes healthy
        run: |
          docker run -d --name openampere openampere:ci
          for _ in $(seq 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' openampere)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 5
          done
          docker logs openampere
          docker inspect -f '{{json .State.Health}}' openampere
          exit 1
