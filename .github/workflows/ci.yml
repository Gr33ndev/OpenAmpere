name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # started by the licenses workflow after it committed updated license files

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Tests
        run: pytest -q
      - name: Third-party licence list up to date
        run: |
          cd web && npm ci && cd ..
          python scripts/third_party_licenses.py --check

  homeassistant:
    # the Home Assistant integration (custom_components/openampere, #76): its own Python and pinned test tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r tests_ha/requirements.txt
      - name: Tests
        run: pytest -q tests_ha

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Demo covers every API endpoint
        run: npm run check:demo
        working-directory: web
      - name: Translations match the texts in the code
        run: npm run check:i18n
        working-directory: web

  ui:
    runs-on: ubuntu-latest
    # usually about 2 minutes; a stuck step fails instead of running for hours (#157)
    timeout-minutes: 15
    # browsers and their system packages come with the image: no download from the package mirrors on every run (#157).
    # The version must be the one of @playwright/test in web/package.json, the first step after npm ci checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Container image has the browsers of @playwright/test
        run: |
          for dir in $(npx playwright install --dry-run chromium webkit | sed -n 's/^ *Install location: *//p'); do
            [ -d "$dir" ] && continue
            echo "::error::$dir is missing: set the image in .github/workflows/ci.yml to the version of @playwright/test ($(node -p "require('@playwright/test/package.json').version"))"
            exit 1
          done
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: UI tests (every page, desktop and iPhone)
        run: npm run test:ui
        working-directory: web
      - name: Report with traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
