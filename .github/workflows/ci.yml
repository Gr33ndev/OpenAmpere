name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # started by the licenses workflow after it committed updated license files

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Tests
        run: pytest -q
      - name: Third-party licence list up to date
        run: |
          cd web && npm ci && cd ..
          python scripts/third_party_licenses.py --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Demo covers every API endpoint
        run: npm run check:demo
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
