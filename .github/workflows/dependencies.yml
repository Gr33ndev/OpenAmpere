name: Dependency files

# Keeps the generated dependency files in sync, so nobody has to think about them:
# - requirements.lock / requirements-dev.lock, generated from pyproject.toml by scripts/lock.sh
# - THIRD_PARTY_LICENSES.md and the in-app license list, generated by scripts/third_party_licenses.py
#
# On every push that touches dependencies (any branch, including Dependabot pull requests) the files are
# regenerated and committed back to that branch as a signed commit. Once a week (or on demand with
# "upgrade") all Python dependencies are moved to their newest allowed versions on the branch
# deps/python-updates, and a pull request is opened or refreshed for it.
on:
  push:
    branches: ["**"]  # not on version tags, there is no branch to commit to
    paths:
      - pyproject.toml
      - requirements.lock
      - requirements-dev.lock
      - web/package.json
      - web/package-lock.json
      - scripts/lock.sh
      - scripts/third_party_licenses.py
  schedule:
    - cron: "17 5 * * 1"  # Mondays, 05:17 UTC
  workflow_dispatch:
    inputs:
      upgrade:
        description: Update all Python dependencies and open a pull request
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}-${{ github.event_name == 'schedule' || inputs.upgrade }}
  cancel-in-progress: true

env:
  UPDATE_BRANCH: deps/python-updates

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commit the regenerated files
      actions: write  # start CI for that commit
      pull-requests: write  # open the weekly update pull request
    env:
      UPGRADE: ${{ github.event_name == 'schedule' || inputs.upgrade == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate lockfiles
        run: |
          pip install uv
          if [ "$UPGRADE" = true ]; then scripts/lock.sh --upgrade; else scripts/lock.sh; fi
      - name: Install exactly the locked dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
          cd web && npm ci
      - name: Regenerate license files
        run: python scripts/third_party_licenses.py

      - name: Commit changes and rerun CI
        if: env.UPGRADE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(python scripts/commit_via_api.py "chore(deps): update lockfiles and third-party licenses" \
            requirements.lock requirements-dev.lock THIRD_PARTY_LICENSES.md web/public/third-party-licenses.json)
          if [ -z "$commit" ]; then
            echo "Everything is up to date."
            exit 0
          fi
          echo "Committed $commit"
          # commits made with the workflow token do not start other workflows by themselves
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"

      - name: Open or refresh the update pull request
        if: env.UPGRADE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="requirements.lock requirements-dev.lock THIRD_PARTY_LICENSES.md web/public/third-party-licenses.json"
          if [ -z "$(git status --porcelain -- $files)" ]; then
            echo "All Python dependencies are already on their newest allowed versions."
            exit 0
          fi
          # start the update branch from the current commit, replacing an older unmerged update
          head=$(git rev-parse HEAD)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$UPDATE_BRANCH" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$UPDATE_BRANCH" -f sha="$head" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$UPDATE_BRANCH" -f sha="$head" --silent
          fi
          python scripts/commit_via_api.py --branch "$UPDATE_BRANCH" "build(deps): update Python dependencies" $files
          gh workflow run ci.yml --ref "$UPDATE_BRANCH"

          body="Weekly update of all Python dependencies to the newest versions pyproject.toml allows, made by the
          \"Dependency files\" workflow. Lockfiles and license list are regenerated. CI runs on this branch, merge when green."
          if [ -n "$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "The open pull request now shows the new versions."
          elif ! gh pr create --head "$UPDATE_BRANCH" --base "$GITHUB_REF_NAME" \
              --title "build(deps): update Python dependencies" --body "$body"; then
            echo "::warning::Could not open the pull request. Allow it under Settings → Actions → General →" \
              "\"Allow GitHub Actions to create and approve pull requests\", or open it by hand from $UPDATE_BRANCH."
          fi
