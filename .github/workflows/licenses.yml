name: Third-party licenses

# Keeps THIRD_PARTY_LICENSES.md and the in-app license list in sync with the dependencies: whenever they
# change on any branch (including Dependabot pull requests), the files are regenerated and committed back
# to that branch as a signed commit, then CI is run again for the new commit.
on:
  push:
    paths:
      - pyproject.toml
      - requirements.lock
      - requirements-dev.lock
      - web/package.json
      - web/package-lock.json
      - scripts/third_party_licenses.py
  workflow_dispatch:

permissions:
  contents: write  # commit the regenerated files
  actions: write  # start CI for that commit

concurrency:
  group: licenses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exactly the locked dependencies
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
          cd web && npm ci
      - name: Regenerate license files
        run: python scripts/third_party_licenses.py
      - name: Commit changes and rerun CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(python scripts/commit_via_api.py "chore(licenses): update third-party licenses" \
            THIRD_PARTY_LICENSES.md web/public/third-party-licenses.json)
          if [ -z "$commit" ]; then
            echo "Licenses are up to date."
            exit 0
          fi
          echo "Committed $commit"
          # commits made with the workflow token do not start other workflows by themselves
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
