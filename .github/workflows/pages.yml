name: Website

# Builds the project website (site/) with the in-browser demo of the web app (demo/) and publishes it on
# GitHub Pages. Enable once under Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "scripts/build-site.sh", ".github/workflows/pages.yml"]
  # the install scripts on the site come from the newest release tag (see scripts/build-site.sh), so they
  # go live once a release is done. Not "release: published": a release made with GITHUB_TOKEN starts no
  # other workflows, and a tag ref would not pass the github-pages environment's branch rule.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release tags for the install scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: scripts/build-site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write  # deploy to Pages
      id-token: write  # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
