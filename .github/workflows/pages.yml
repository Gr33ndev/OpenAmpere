name: Website

# Builds the project website (site/) with the in-browser demo of the web app (demo/) and publishes it on
# GitHub Pages. Enable once under Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "web/**", "docs/devices/**", "scripts/build-site.sh", "scripts/site-scripts.sh",
            "scripts/build-site-pages.mjs", "scripts/markdown.mjs", ".github/workflows/pages.yml"]
  # the install scripts on the site come from the newest release tag (see scripts/build-site.sh), so they
  # go live once a release is done. Not "release: published": a release made with GITHUB_TOKEN starts no
  # other workflows, and a tag ref would not pass the github-pages environment's branch rule.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time: a running one finishes, a newer run waits and runs queued in between are skipped. Not
# cancel-in-progress: a cancelled run leaves its Pages deployment "in progress", and the next deploy is refused
# (after a release, the Release trigger and the push of main start two runs a minute apart, #398)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts  # the build needs no install scripts of packages
        working-directory: web
      - run: SITE_SCRIPTS=skip scripts/build-site.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          include-hidden-files: true  # .nojekyll
          if-no-files-found: error
          retention-days: 1

  # the site with install.sh, updater.sh and tailscale.sh (plus their SHA256SUMS) on top. This job writes them itself
  # from its own checkout, runs no code of npm packages and takes nothing but the site from the build job: a
  # compromised package of the site build must not be able to change what users install as root, also not by
  # uploading an artifact under the name of another one
  assemble:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read  # the checkout for the install scripts
      pages: read  # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the release tags for the install scripts
          persist-credentials: false
      # before anything of the build job is here
      - run: scripts/site-scripts.sh _scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site
      # whatever the build put under these names is replaced
      - run: |
          rm -rf _site/install.sh _site/tailscale.sh _site/updater.sh _site/SHA256SUMS
          cp _scripts/install.sh _scripts/tailscale.sh _scripts/updater.sh _scripts/SHA256SUMS _site/
          cd _site && sha256sum -c SHA256SUMS
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write  # deploy to Pages
      id-token: write  # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
