name: Release

# A version tag (e.g. v0.2.0, made with scripts/release.sh) builds the Docker image for x86 and ARM
# (Raspberry Pi), publishes it as ghcr.io/<owner>/openampere (and the Home Assistant app as
# ghcr.io/<owner>/openampere-ha-app) with an SBOM and a signed build provenance attestation and creates a GitHub release with notes from the commits since the previous tag and the
# install scripts plus SHA256SUMS attached, with a signed build provenance for them (.intoto.jsonl, #203).
# "Run workflow" with a tag only (re)writes that release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose release should be created or updated (no new image)
        required: true

permissions:
  contents: read

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # publish the image
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the version in pyproject.toml, web/package.json, the Home Assistant integration and app
        run: |
          py=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          web=$(python3 -c 'import json; print(json.load(open("web/package.json"))["version"])')
          ha=$(python3 -c 'import json; print(json.load(open("custom_components/openampere/manifest.json"))["version"])')
          app=$(sed -n 's/^version: "\(.*\)"$/\1/p' ha-app/config.yaml)
          echo "tag $GITHUB_REF_NAME, pyproject $py, web $web, homeassistant $ha, app $app"
          [ "v$py" = "$GITHUB_REF_NAME" ] && [ "v$web" = "$GITHUB_REF_NAME" ] && [ "v$ha" = "$GITHUB_REF_NAME" ] \
            && [ "v$app" = "$GITHUB_REF_NAME" ]
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image  # registry names must be lowercase, the owner is not
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openampere" >> "$GITHUB_OUTPUT"
      # :latest is what the update helper and the installer install: only the highest stable version gets it, so a
      # tag for an older version (a backport) or a pre-release (-rc) does not reach, or downgrade, every installation
      - id: newest
        run: |
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | grep -vF -- '-' | sort -V | tail -n 1)
          echo "tag $GITHUB_REF_NAME, highest stable version $highest"
          echo "latest=$([ "$GITHUB_REF_NAME" = "$highest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest == 'true' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      # check with: gh attestation verify oci://ghcr.io/gr33ndev/openampere:<version> --owner Gr33ndev \
      #   --signer-workflow Gr33ndev/OpenAmpere/.github/workflows/release.yml --source-ref refs/tags/v<version>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false  # storage records exist only for organization-owned repositories
      # the Home Assistant app (#300): the same layers plus its start script. Home Assistant installs the tag that
      # is the version in ha-app/config.yaml, so no :latest
      - id: ha-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ha-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}-ha-app:${{ steps.meta.outputs.version }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}-ha-app
          subject-digest: ${{ steps.ha-build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    needs: image
    # after a successful image build, or on its own when started by hand
    if: always() && (needs.image.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
      id-token: write      # sign the provenance attestation of the attached files (Sigstore)
      attestations: write  # store the attestation
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all tags and commits for the notes
      # the files of the tag are signed below, so a run by hand takes only a version tag made by scripts/release.sh
      # (annotated) whose commit is on main (GHSA-3xmc-fc67-chgq). A pushed tag comes before main (see release.sh);
      # pushing v* tags needs admin rights (ruleset)
      - name: The tag is a version tag of main
        env:
          EVENT: ${{ github.event_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Not a version tag"; exit 1; }
          [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = tag ] \
            || { echo "::error::$TAG is not an annotated tag of this repository"; exit 1; }
          if [ "$EVENT" != push ]; then
            git fetch -q origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "refs/tags/$TAG^{commit}" refs/remotes/origin/main \
              || { echo "::error::$TAG is not on main"; exit 1; }
          fi
      - name: Collect the files to attach
        run: |
          # the install scripts as of the tag (a manual run checks out main) with checksums to verify a download
          mkdir assets
          for f in install.sh tailscale.sh updater.sh; do
            if git cat-file -e "refs/tags/$TAG:scripts/$f" 2>/dev/null; then
              git show "refs/tags/$TAG:scripts/$f" > "assets/$f"
            fi
          done
          (cd assets && sha256sum *.sh > SHA256SUMS && cat SHA256SUMS)
      # check with: gh attestation verify install.sh --repo Gr33ndev/OpenAmpere \
      #   --signer-workflow Gr33ndev/OpenAmpere/.github/workflows/release.yml --source-ref refs/tags/v<version>
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Create or update the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # the signed provenance as a release file as well, for checks without the GitHub API (and Scorecard)
          cp "$BUNDLE" "assets/openampere-${TAG#v}.intoto.jsonl"
          python3 scripts/release_notes.py "$TAG" > notes.md
          cat notes.md
          # only the highest stable version is "Latest", also when an older release is written afterwards
          newest=$(git tag -l 'v*' --sort=-v:refname | grep -v -- - | head -n 1)
          latest=$([ "$TAG" = "$newest" ] && echo true || echo false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --latest="$latest"
            gh release upload "$TAG" assets/* --clobber
          else
            flags=""
            case "$TAG" in *-*) flags="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --title "OpenAmpere ${TAG#v}" --notes-file notes.md \
              --latest="$latest" $flags assets/*
          fi
