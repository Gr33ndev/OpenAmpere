name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev): an outside check of the project's security practices
# (token permissions, pinned dependencies, branch protection, ...). The findings appear under
# Security → Code scanning, the score is published for the badge in the README.
on:
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 2"  # Tuesdays, 04:29 UTC
  branch_protection_rule:  # the Branch-Protection check changes with these rules
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the results to code scanning
      id-token: write  # publish the results and get the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
