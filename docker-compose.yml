services:
  openampere:
    build: .
    image: openampere:latest
    restart: unless-stopped
    # Host-Netzwerk, damit die Gerätesuche das Heimnetz sieht (Linux, z. B. Proxmox/Raspberry Pi).
    # Die App ist dann direkt unter http://<server-ip>:8080 erreichbar, Home Assistant verbindet sich über
    # HTTPS auf Port 8443 (siehe docs/homeassistant.md).
    network_mode: host
    cap_drop: [ALL]  # die App braucht keine besonderen Rechte
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/data
      # - ./remote:/data/remote  # Austausch mit Tailscale, nur zusammen mit dem Dienst tailscale unten
    environment:
      TZ: Europe/Berlin
      # Optional: Werte hier fest vorgeben. Sie sind dann in der App gesperrt.
      # OPENAMPERE_INVERTER_HOST: "192.168.178.50"

  # Optional, nur mit Wallbox: evcc steuert die Wallbox (https://evcc.io, siehe docs/evcc.md).
  # Zum Einschalten die Zeilen unten einkommentieren und `docker compose up -d` ausführen.
  # evcc ist dann unter http://<server-ip>:7070 erreichbar, Wallbox und Fahrzeug richtet man dort ein.
  # evcc:
  #   image: evcc/evcc:latest
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./evcc:/root/.evcc

  # Optional, für den Zugriff von unterwegs: Tailscale (https://tailscale.com). Zum Einschalten zuerst den Ordner für
  # den Austausch mit der App anlegen. Er gehört root, die App schreibt nur in inbox (GHSA-2j3r-6fcx-9m7v):
  #   sudo mkdir -p remote/inbox && sudo chown root:root remote && sudo chmod 755 remote
  #   sudo chown 1000:1000 remote/inbox
  # Dann die Zeile ./remote:/data/remote bei openampere oben und die Zeilen unten einkommentieren, `docker compose up -d`
  # ausführen und in der App unter Mehr → Zugriff von unterwegs einrichten.
  # tailscale:
  #   image: tailscale/tailscale:stable
  #   restart: unless-stopped
  #   network_mode: host
  #   entrypoint: ["sh", "/openampere/tailscale.sh"]
  #   volumes:
  #     - ./tailscale:/var/lib/tailscale
  #     - ./remote:/remote  # nicht unter data: dort könnte die App Links anlegen
  #     - ./scripts/tailscale.sh:/openampere/tailscale.sh:ro
