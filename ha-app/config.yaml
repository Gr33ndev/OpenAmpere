# OpenAmpere as a Home Assistant app (#300). Home Assistant reads this file from the main branch. The version is the
# tag of the image it installs: scripts/release.sh sets it, and main is pushed only after the image is published.
name: OpenAmpere
version: "0.23.1"
slug: openampere
description: Local app for solar systems with battery storage (FoxESS H3, SAJ H2/HS2), without a cloud
url: https://github.com/Gr33ndev/OpenAmpere
arch:
  - aarch64
  - amd64
image: ghcr.io/gr33ndev/openampere-ha-app
stage: experimental
# the web app in the sidebar; the panel is only for admins (default), because the app can control the inverter
ingress: true
ingress_port: 8080
panel_icon: mdi:solar-power-variant
# direct access by IP address (evcc, phones); 8080/8443 are taken by popular apps such as UniFi
ports:
  8080/tcp: 8780
  8443/tcp: 8743
hassio_api: true  # the home network for the device search and the address for direct access
homeassistant_api: true  # a notice in Home Assistant after installing the integration
# the integration of this version goes into custom_components of Home Assistant, so no HACS is needed
map:
  - type: homeassistant_config
    read_only: false
discovery:
  - openampere  # the Home Assistant integration offers to set up the app
watchdog: http://[HOST]:[PORT:8080]/api/auth/status?healthcheck=1
# a copy of a database that is being written can be broken: backups take a consistent copy instead
backup_pre: ha-app-start ha-backup-copy
backup_post: ha-app-start ha-backup-done
backup_exclude:
  - openampere.db
  - openampere.db-wal
  - openampere.db-shm
  - openampere.db-journal
  - openampere.db.lock
