[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openampere"
version = "0.42.0"
description = "Local-only app for home solar and battery systems (FoxESS H3, SAJ H2)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "pymodbus>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "pyyaml>=6",
    "cryptography>=42",
    # time zones where the system has none: the Android app (#567); on Linux Python keeps using the system's
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "packaging>=23", "hypothesis>=6", "ruff>=0.15",
       "pytest-cov>=6", "diff-cover>=9"]

[project.urls]
Homepage = "https://github.com/Gr33ndev/OpenAmpere"
Issues = "https://github.com/Gr33ndev/OpenAmpere/issues"

[project.scripts]
openampere = "openampere.__main__:main"
openampere-simulator = "openampere.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Test coverage (#630): CI runs `pytest --cov` and diff-cover requires 70 % of the lines a pull request adds or changes
# (CONTRIBUTING.md#tests-and-coverage). Line coverage of the backend; code that only runs against real hardware may be
# excluded with `# pragma: no cover` and a comment saying why.
[tool.coverage.run]
source = ["openampere"]
omit = ["*/openampere/web/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.setuptools.package-data]
openampere = ["web/*", "web/**/*", "locales/*.json"]

# Python style: PEP 8 as checked by ruff (pycodestyle and pyflakes rules), see CONTRIBUTING.md#code-rules.
# Lines are wrapped at about 120 characters; the length is not enforced (E501), long messages and tables stay readable.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".claude", "web"]
# the Home Assistant integration runs on the Python of Home Assistant
per-file-target-version = { "custom_components/**" = "py313", "tests_ha/**" = "py313" }

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]
